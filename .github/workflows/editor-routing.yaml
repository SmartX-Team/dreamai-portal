name: Confirm the retained latest release
on:
  push:
    branches: [codex/dreamai-visual-editor]
    paths: ['.github/workflows/editor-routing.yaml']
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    environment: trial
    steps:
      - uses: azure/setup-kubectl@v3
      - name: Confirm the live image is still pullable after cleanup
        env:
          CONFIG: ${{ secrets.DREAMAI_RELEASE_K8S_CONFIG || secrets.K8S_CONFIG }}
        run: |
          umask 077
          directory=$(mktemp -d)
          trap 'rm -f "$directory/config" "$directory/page"; rmdir "$directory"' EXIT
          export KUBECONFIG="$directory/config"
          printf '%s\n' "$CONFIG" > "$KUBECONFIG"
          password=$(kubectl -n dreamai get secret dreamai-editor-registry-auth -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::$password"
          head=$(curl -fsSI --max-time 8 --user "trial-release:$password" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            'https://dreamai.mobilex.kr/v2/dreamai-portal-trial/manifests/latest')
          digest=$(awk 'tolower($1)=="docker-content-digest:" {gsub(/\r/,"",$2); print $2}' <<< "$head")
          test "$digest" = 'sha256:ee958358d9a3b614828b0ba3f5bbfe44762a235a3622ff071f92a2eacc43bb66'
          echo "The latest tag still resolves to $digest."
          curl -fsS --max-time 8 'https://dreamai.mobilex.kr/' -o "$directory/page"
          grep -Fq 'dreamai-workspace-login' "$directory/page"
          kubectl -n dreamai rollout status deployment/dreamai-demo --timeout=1m
