name: Recover the trial site's existing media
on:
  push:
    branches: [codex/dreamai-visual-editor]
    paths: ['.github/workflows/editor-routing.yaml']
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    environment: trial
    steps:
      - uses: azure/setup-kubectl@v3
      - name: Retain the referenced images on the shared content volume
        env:
          CONFIG: ${{ secrets.DREAMAI_RELEASE_K8S_CONFIG || secrets.K8S_CONFIG }}
        run: |
          umask 077
          directory=$(mktemp -d)
          trap 'rm -f "$directory/kubeconfig"; rmdir "$directory"' EXIT
          export KUBECONFIG="$directory/kubeconfig"
          printf '%s\n' "$CONFIG" > "$KUBECONFIG"
          kubectl -n dreamai exec -i deployment/dreamai-test -c frontend -- node - <<'NODE'
          const fs = require("node:fs/promises");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const previous = "/releases/f34edd8de1c8/.next/standalone/public";
          const target = "/var/lib/dreamai/legacy-media";
          const needed = [
            "images/category/category_event.png",
            "images/category/category_nputraining.png",
            "images/annex/annex.png",
            "images/annex/sw-lab-1.png",
            "images/annex/sw-lab-2.png",
            "images/annex/ai-instructor-room.png",
            "images/annex/dream-ai-room.png",
            "images/annex/physical-ai-room.png",
            "images/annex/agentic-ai-room.png",
            "images/space/livinglab_1.png",
            "images/nputraining/nputraining_poster2.png",
            "images/nputraining/nputraining_poster.png",
          ];
          (async () => {
            await fs.mkdir(target, { recursive: true });
            const map = {};
            for (const relative of needed) {
              let bytes;
              try { bytes = await fs.readFile(path.join(previous, relative)); }
              catch (error) {
                if (error.code !== "ENOENT") throw error;
                console.log(JSON.stringify({ relative, missing: true }));
                continue;
              }
              if (!bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) {
                throw new Error("Expected PNG source: " + relative);
              }
              const digest = crypto.createHash("sha256").update(bytes).digest("hex") + ".png";
              const image = path.join(target, digest);
              const temporary = path.join(target, "." + crypto.randomUUID());
              await fs.writeFile(temporary, bytes, { flag: "wx" });
              await fs.rename(temporary, image);
              map[relative] = digest;
              console.log(JSON.stringify({ relative, bytes: bytes.length, digest }));
            }
            const temporary = path.join(target, "." + crypto.randomUUID());
            await fs.writeFile(temporary, JSON.stringify(map), { flag: "wx" });
            await fs.rename(temporary, path.join(target, "images.json"));
            console.log("Retained assets: " + Object.keys(map).length + "/" + needed.length);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
