name: Activate the trial editor and demo
on:
  push:
    branches: [codex/dreamai-visual-editor]
    paths: ['.github/workflows/editor-routing.yaml']
permissions:
  contents: read
concurrency:
  group: dreamai-container-release
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    environment: trial
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - name: Start the deployed container entry point
        env:
          CONFIG: ${{ secrets.DREAMAI_RELEASE_K8S_CONFIG || secrets.K8S_CONFIG }}
        run: |
          umask 077
          directory=$(mktemp -d)
          trap 'rm -f "$directory/kubeconfig" "$directory/trial.html"; rmdir "$directory"' EXIT
          export KUBECONFIG="$directory/kubeconfig"
          printf '%s\n' "$CONFIG" > "$KUBECONFIG"
          trial=$(kubectl -n dreamai get deployment dreamai-test -o json)
          reference=$(jq -er '.spec.template.spec.containers[] | select(.name=="frontend") | .image' <<< "$trial")
          expected="dreamai.mobilex.kr/dreamai-portal-trial:latest@sha256:19860d95458b31a481f131f8eb58161f1eccd216f8e5bb46b0554c8703527ba5"
          test "$reference" = "$expected"
          kubectl -n dreamai patch deployment/dreamai-test --type strategic -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","workingDir":"/usr/src/app","command":["node","/usr/src/app/server.js"],"args":[]}]}}}}'
          kubectl -n dreamai rollout status deployment/dreamai-test --timeout=5m
          for attempt in {1..12}; do
            if curl -fsS --max-time 12 "https://dreamai.mobilex.kr/?editor-release=$attempt" -o "$directory/trial.html" &&
              grep -Fq 'dreamai-workspace-login' "$directory/trial.html"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::The deployed trial login did not appear at the public address."
              exit 1
            fi
            sleep 3
          done
          existing=$(kubectl -n dreamai get ingress -o json | jq -r '
            .items[] | select(any(.spec.rules[]?; .host == "demo.dreamai.kr")) | .metadata.name')
          if [[ -n "$existing" && "$existing" != dreamai-demo ]]; then
            echo "::error::The demo address already has a different Ingress."
            exit 1
          fi
          python3 -c 'import sys; print(sys.stdin.read().replace("registry.invalid/dreamai-trial:latest", sys.argv[1]), end="")' \
            "$reference" < deployment/kubernetes/editor-demo.yaml | kubectl -n dreamai apply -f -
          image_secrets=$(jq -c '.spec.template.spec.imagePullSecrets // []' <<< "$trial")
          if [[ "$image_secrets" != '[]' ]]; then
            kubectl -n dreamai patch deployment dreamai-demo --type merge -p \
              "$(jq -n --argjson secrets "$image_secrets" '{spec:{template:{spec:{imagePullSecrets:$secrets}}}}')"
          fi
          kubectl -n dreamai rollout status deployment/dreamai-demo --timeout=5m
          printf 'Trial and demo use %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
