name: Inspect trial registry provisioning
on:
  push:
    branches: [codex/dreamai-visual-editor]
    paths: ['.github/workflows/editor-observe.yaml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: trial
    steps:
      - uses: azure/setup-kubectl@v3
      - name: Inspect registry startup
        env:
          CONFIG: ${{ secrets.DREAMAI_RELEASE_K8S_CONFIG || secrets.K8S_CONFIG }}
          DIAGNOSTIC_PUBLIC: 
        run: |
          umask 077
          directory=$(mktemp -d)
          trap 'rm -f "$directory/kubeconfig" "$directory/public.pem"; rmdir "$directory"' EXIT
          export KUBECONFIG="$directory/kubeconfig"
          printf '%s\n' "$CONFIG" > "$KUBECONFIG"
          printf '%s' "$DIAGNOSTIC_PUBLIC" | base64 -d > "$directory/public.pem"
          location=$(kubectl config view --minify -o 'jsonpath={.clusters[0].cluster.server}{"\n"}{.clusters[0].cluster.tls-server-name}')
          printf 'TRIAL_API_LOCATION='
          printf '%s' "$location" | openssl pkeyutl -encrypt -pubin -inkey "$directory/public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
          printf '\n'
          kubectl -n dreamai get pods -l app=dreamai-editor-registry -o json | jq '
            .items[] | { name: .metadata.name, phase: .status.phase,
              scheduling: [.status.conditions[]? | select(.type == "PodScheduled") | {status,reason,message}],
              containers: [.status.containerStatuses[]? | {ready,state}] }'
          kubectl -n dreamai get events --field-selector involvedObject.kind=Pod --sort-by=.lastTimestamp |
            grep -F dreamai-editor-registry | tail -n 10 || true
          kubectl -n dreamai logs deployment/dreamai-editor-registry --tail=10 || true
