name: CI/CD to Kubernetes

on:
  push:
    branches: [codex/dreamai-visual-editor]
    paths-ignore:
      - '.github/workflows/editor-routing.yaml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        options:
          - trial
          - demo
          - production
        default: trial
      approved_digest:
        description: Verified trial image digest for production
        type: string

permissions:
  contents: read

concurrency:
  group: dreamai-container-release
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'trial' }}

jobs:
  release:
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[routing-only]')) ||
      inputs.target == 'trial' || inputs.target == 'demo' ||
      (inputs.target == 'production' && github.ref == 'refs/heads/main' &&
      vars.DREAMAI_PRODUCTION_RELEASE_ENABLED == 'true' &&
      vars.DREAMAI_PUBLISHER_GITHUB_ID != '' &&
      format('{0}', github.actor_id) == vars.DREAMAI_PUBLISHER_GITHUB_ID)
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'trial' }}
    env:
      TRIAL_IMAGE: ${{ vars.DREAMAI_TRIAL_IMAGE }}
      PRODUCTION_IMAGE: ${{ vars.DREAMAI_PRODUCTION_IMAGE }}
      TRIAL_CONTAINER: ${{ vars.DREAMAI_TRIAL_CONTAINER_NAME }}
      APPROVED_DIGEST: ${{ inputs.approved_digest }}
      DEPLOYMENT: ${{ inputs.target == 'production' && 'portal' || inputs.target == 'demo' && 'dreamai-demo' || 'dreamai-test' }}
      CONTAINER: ${{ vars.K8S_CONTAINER_NAME }}
    steps:
      - name: Check release configuration
        env:
          LEGACY_IMAGE: ${{ secrets.IMAGE_NAME }}
        run: |
          if [[ -z "$TRIAL_IMAGE" ]]; then
            TRIAL_IMAGE="${LEGACY_IMAGE:-harbor.mobilex.kr/seoin/dreamai}-trial"
          fi
          echo "TRIAL_IMAGE=$TRIAL_IMAGE" >> "$GITHUB_ENV"
          if [[ -n "$PRODUCTION_IMAGE" ]]; then
            test "$TRIAL_IMAGE" != "$PRODUCTION_IMAGE"
          fi
          if [[ "$TARGET" == "production" ]]; then
            test -n "$PRODUCTION_IMAGE"
          fi
          if [[ "$TARGET" != "trial" ]]; then
            [[ "$APPROVED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi

      - name: Check out release files
        if: env.TARGET != 'production'
        uses: actions/checkout@v4
        with:
          lfs: ${{ env.TARGET == 'trial' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.DREAMAI_RELEASE_K8S_CONFIG }}
          LEGACY_TRIAL_CONFIG: ${{ env.TARGET == 'trial' && secrets.K8S_CONFIG || '' }}
        run: |
          KUBE_CONFIG="${KUBE_CONFIG:-$LEGACY_TRIAL_CONFIG}"
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "::error::Kubernetes credentials are missing for the selected environment."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KUBE_CONFIG" > "$RUNNER_TEMP/dreamai-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/dreamai-kubeconfig" >> "$GITHUB_ENV"

      - name: Check trial deployment prerequisites
        if: env.TARGET == 'trial'
        env:
          LEGACY_CONTAINER: ${{ secrets.K8S_DEPLOYMENT_CONTAINER_NAME }}
        run: |
          running=$(kubectl -n dreamai --request-timeout=15s get deployment dreamai-test -o json)
          CONTAINER="${CONTAINER:-$LEGACY_CONTAINER}"
          if [[ -z "$CONTAINER" ]] || ! jq -e --arg container "$CONTAINER" 'any(.spec.template.spec.containers[]; .name == $container)' <<< "$running" >/dev/null; then
            CONTAINER=$(jq -er '[.spec.template.spec.containers[] | select(any(.ports[]?; .containerPort == 3000))] |
              if length == 1 then .[0].name else error("Set the trial container name.") end' <<< "$running")
          fi
          jq -e --arg container "$CONTAINER" 'any(.spec.template.spec.containers[]; .name == $container)' <<< "$running" >/dev/null
          echo "CONTAINER=$CONTAINER" >> "$GITHUB_ENV"
          kubectl -n dreamai --request-timeout=15s get secret dreamai-editor-password -o name >/dev/null
          status=$(kubectl -n dreamai --request-timeout=15s get pvc dreamai-editor-content -o jsonpath='{.status.phase}')
          if [[ "$status" != Bound ]]; then
            echo "::error::The dreamai-editor-content claim must be bound before deploying the editor."
            exit 1
          fi

      - name: Log in to Harbor
        id: harbor
        continue-on-error: ${{ env.TARGET == 'trial' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.IMAGE_REGISTRY_URL }}
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}

      - name: Use the trial deployment's existing registry access
        id: trial_registry_access
        continue-on-error: true
        if: env.TARGET == 'trial' && steps.harbor.outcome == 'failure'
        run: |
          registry="${TRIAL_IMAGE%%/*}"
          deployment=$(kubectl -n dreamai get deployment dreamai-test -o json)
          running=$(jq -er --arg container "$CONTAINER" '.spec.template.spec.containers[] | select(.name == $container) | .image' <<< "$deployment")
          if [[ "$running" != "$registry/"* ]]; then
            echo "::error::The trial deployment uses a different registry and Harbor refused the configured credentials."
            exit 1
          fi
          account=$(jq -r '.spec.template.spec.serviceAccountName // "default"' <<< "$deployment")
          service_account=$(kubectl -n dreamai get serviceaccount "$account" -o json 2>/dev/null || printf '{}')
          mapfile -t names < <(jq -r '.spec.template.spec.imagePullSecrets[]?.name' <<< "$deployment"
            jq -r '.imagePullSecrets[]?.name' <<< "$service_account")
          config="$RUNNER_TEMP/dreamai-registry-config"
          mkdir -m 700 "$config"
          umask 077
          for name in "${names[@]}"; do
            encoded=$(kubectl -n dreamai get secret "$name" -o jsonpath='{.data.\.dockerconfigjson}')
            [[ -n "$encoded" ]] || continue
            printf '%s' "$encoded" | base64 -d | jq -ec --arg host "$registry" \
              '{auths: (.auths | with_entries(select((.key | sub("^https?://";"") | split("/")[0]) == $host)))} |
                select(.auths | length > 0)' > "$config/config.json" || continue
            if docker --config "$config" manifest inspect "$running" >/dev/null 2>&1; then
              echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Harbor rejected the configured credentials and the trial deployment has no usable registry credential."
          exit 1

      - name: Start the authenticated trial registry
        if: env.TARGET == 'trial' && steps.harbor.outcome == 'failure' && steps.trial_registry_access.outcome == 'failure'
        run: bash deployment/prepare-trial-registry.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push trial latest
        id: trial
        if: env.TARGET == 'trial'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.TRIAL_IMAGE }}:latest

      - name: Select the verified trial image
        id: promotion
        if: env.TARGET != 'trial'
        run: |
          kubectl -n dreamai rollout status deployment/dreamai-test --timeout=2m
          running=$(kubectl -n dreamai get deployment dreamai-test -o json)
          running_image=$(jq -er --arg container "$TRIAL_CONTAINER" --arg image "$TRIAL_IMAGE" \
            '.spec.template.spec.containers[] |
              select(if $container != "" then .name == $container else (.image | startswith($image + ":latest@")) end) | .image' <<< "$running")
          test "$running_image" = "$TRIAL_IMAGE:latest@$APPROVED_DIGEST"
          if [[ "$TARGET" == "production" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$PRODUCTION_IMAGE:latest" "$TRIAL_IMAGE@$APPROVED_DIGEST"
            promoted=$(docker buildx imagetools inspect "$PRODUCTION_IMAGE:latest" --format '{{json .Manifest}}' | jq -er '.digest')
            test "$promoted" = "$APPROVED_DIGEST"
          fi
          echo "digest=$APPROVED_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait for rollout
        env:
          DIGEST: ${{ steps.trial.outputs.digest || steps.promotion.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          case "$TARGET" in
            trial) IMAGE="$TRIAL_IMAGE"; SITE="https://dreamai.mobilex.kr" ;;
            demo) IMAGE="$TRIAL_IMAGE"; SITE="https://demo.dreamai.kr" ;;
            production) IMAGE="$PRODUCTION_IMAGE"; SITE="https://dreamai.kr" ;;
          esac
          reference="$IMAGE:latest@$DIGEST"
          if [[ "$TARGET" == "trial" ]]; then
            patch=$(jq -n --arg container "$CONTAINER" --arg image "$reference" --arg pull "${TRIAL_PULL_SECRET:-}" '{
              spec: { template: { spec: ({
                securityContext: {fsGroup: 1001, fsGroupChangePolicy: "OnRootMismatch"},
                containers: [{
                  name: $container, image: $image,
                  workingDir: "/usr/src/app",
                  command: ["node", "/usr/src/app/server.js"],
                  args: [],
                  env: [
                    {name: "DREAMAI_CONTENT_MODE", value: "draft"},
                    {name: "DREAMAI_CONTENT_DIR", value: "/var/lib/dreamai"},
                    {name: "DREAMAI_EDITOR_ORIGIN", value: "https://dreamai.mobilex.kr"},
                    {name: "DREAMAI_EDITOR_PASSWORD_FILE", value: "/var/run/dreamai-editor/password.txt"},
                    {name: "DREAMAI_EDITOR_RELEASE_TARGET", value: "demo"}
                  ],
                  volumeMounts: [
                    {name: "portal-editor-content", mountPath: "/var/lib/dreamai"},
                    {name: "portal-editor-password", mountPath: "/var/run/dreamai-editor", readOnly: true}
                  ]
                }],
                volumes: [
                  {name: "portal-editor-content", persistentVolumeClaim: {claimName: "dreamai-editor-content"}},
                  {name: "portal-editor-password", secret: {secretName: "dreamai-editor-password"}}
                ]
              } + (if $pull == "" then {} else {imagePullSecrets:[{name:$pull}]} end)) } }
            }')
            kubectl -n dreamai patch "deployment/$DEPLOYMENT" --type strategic -p "$patch"
          elif [[ "$TARGET" == "demo" ]]; then
            python3 -c 'import sys; print(sys.stdin.read().replace("registry.invalid/dreamai-trial:latest", sys.argv[1]), end="")' \
              "$reference" < deployment/kubernetes/editor-demo.yaml |
              kubectl -n dreamai apply -f -
          else
            test -n "$CONTAINER"
            kubectl -n dreamai set image "deployment/$DEPLOYMENT" "$CONTAINER=$reference"
          fi
          kubectl -n dreamai rollout status "deployment/$DEPLOYMENT" --timeout=5m
          if [[ "$TARGET" == "trial" ]]; then
            curl --fail --silent --show-error --location --retry 3 --max-time 20 "$SITE/" -o "$RUNNER_TEMP/dreamai-trial.html"
            grep -Fq 'dreamai-workspace-login' "$RUNNER_TEMP/dreamai-trial.html"
          fi
          {
            printf 'Site: %s\n\n' "$SITE"
            printf 'Container: %s:latest@%s\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the isolated demo with the same trial image
        if: env.TARGET == 'trial'
        env:
          DIGEST: ${{ steps.trial.outputs.digest }}
        run: |
          existing=$(kubectl -n dreamai get ingress -o json | jq -r '
            .items[] | select(any(.spec.rules[]?; .host == "demo.dreamai.kr")) | .metadata.name')
          if [[ -n "$existing" && "$existing" != dreamai-demo ]]; then
            echo "::error::demo.dreamai.kr is already routed by another Ingress."
            exit 1
          fi
          reference="$TRIAL_IMAGE:latest@$DIGEST"
          python3 -c 'import sys; print(sys.stdin.read().replace("registry.invalid/dreamai-trial:latest", sys.argv[1]), end="")' \
            "$reference" < deployment/kubernetes/editor-demo.yaml | kubectl -n dreamai apply -f -
          image_secrets=$(kubectl -n dreamai get deployment dreamai-test -o json | jq -c '.spec.template.spec.imagePullSecrets // []')
          if [[ "$image_secrets" != '[]' ]]; then
            kubectl -n dreamai patch deployment dreamai-demo --type merge -p \
              "$(jq -n --argjson secrets "$image_secrets" '{spec:{template:{spec:{imagePullSecrets:$secrets}}}}')"
          fi
          kubectl -n dreamai rollout status deployment/dreamai-demo --timeout=5m

      - name: Remove the temporary kubeconfig
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dreamai-kubeconfig" "$RUNNER_TEMP/dreamai-trial.html" "$RUNNER_TEMP/dreamai-registry-config/config.json"
          if [[ -d "$RUNNER_TEMP/dreamai-registry-config" ]]; then rmdir "$RUNNER_TEMP/dreamai-registry-config" 2>/dev/null || true; fi
          rm -f "$RUNNER_TEMP/dreamai-trial-registry-config/config.json"
          if [[ -d "$RUNNER_TEMP/dreamai-trial-registry-config" ]]; then rmdir "$RUNNER_TEMP/dreamai-trial-registry-config" 2>/dev/null || true; fi
